name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # manual trigger for the full mutation-testing run

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so Infection can diff against origin/master

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP-CS-Fixer (dry-run)
        if: matrix.php == '8.4'
        run: composer cs-check

      - name: PHPStan (level max)
        run: composer phpstan

      - name: PHPUnit
        run: composer test -- --coverage-clover=coverage.xml

      # Only the changed lines are mutated on a PR — a full run is minutes of
      # CPU for a diff of a few lines. master is NOT protected here, so a
      # direct push (how releases land) is deliberately left un-gated: run the
      # full suite manually via workflow_dispatch before a significant release.
      - name: Infection (mutation testing, diff)
        if: matrix.php == '8.4' && github.event_name == 'pull_request'
        run: composer infection -- --git-diff-lines --git-diff-base=origin/master --logger-github --ignore-msi-with-no-mutations

      - name: Infection (mutation testing, full)
        if: matrix.php == '8.4' && github.event_name == 'workflow_dispatch'
        run: composer infection -- --logger-github

      - name: Upload coverage to Codecov
        if: matrix.php == '8.4'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
